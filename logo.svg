<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" role="img" aria-label="Piratenschip">
  <defs>
    <linearGradient id="pl-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6531"/>
      <stop offset="1" stop-color="#3a2211"/>
    </linearGradient>

    <!-- zeilvormen -->
    <clipPath id="pl-s-main"><path d="M76 38Q110 48 144 38V80Q110 90 76 80Z"/></clipPath>
    <clipPath id="pl-s-fore"><path d="M34 56Q53 62 72 56V86Q53 92 34 86Z"/></clipPath>
    <clipPath id="pl-s-miz"><path d="M148 52Q167 58 186 52V82Q167 88 148 82Z"/></clipPath>

    <!-- testbeeld (160 x 120) -->
    <clipPath id="pl-circ"><circle cx="80" cy="60" r="48"/></clipPath>
    <pattern id="pl-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#575757"/>
      <path d="M0 0H10M0 0V10" stroke="#fff" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="pl-fine" width="2.4" height="10" patternUnits="userSpaceOnUse">
      <rect width="1.2" height="10" fill="#fff"/>
    </pattern>
    <g id="pl-tp">
      <rect width="160" height="120" fill="url(#pl-grid)"/>
      <!-- zijbalken -->
      <rect x="8" y="6" width="9" height="54" fill="#3cb371"/>
      <rect x="18" y="6" width="10" height="22" fill="#7b52ff"/>
      <rect x="8" y="60" width="9" height="50" fill="#d6578a"/>
      <rect x="18" y="94" width="10" height="16" fill="#a67c00"/>
      <rect x="143" y="6" width="9" height="54" fill="#76b82a"/>
      <rect x="132" y="6" width="10" height="22" fill="#7b52ff"/>
      <rect x="143" y="60" width="9" height="50" fill="#7b52ff"/>
      <rect x="132" y="94" width="10" height="16" fill="#a67c00"/>
      <!-- cirkel -->
      <g clip-path="url(#pl-circ)">
        <rect x="32" y="12" width="96" height="96" fill="#fff"/>
        <rect x="52" y="14" width="56" height="10" fill="#000"/>
        <rect x="32" y="26" width="96" height="10" fill="#000"/>
        <g fill="#aaa">
          <rect x="36" y="26" width="8" height="10"/><rect x="52" y="26" width="8" height="10"/>
          <rect x="68" y="26" width="8" height="10"/><rect x="84" y="26" width="8" height="10"/>
          <rect x="100" y="26" width="8" height="10"/><rect x="116" y="26" width="8" height="10"/>
        </g>
        <rect x="32" y="38" width="16" height="20" fill="#ffff00"/>
        <rect x="48" y="38" width="16" height="20" fill="#55dbe8"/>
        <rect x="64" y="38" width="16" height="20" fill="#00cc00"/>
        <rect x="80" y="38" width="16" height="20" fill="#cc00cc"/>
        <rect x="96" y="38" width="16" height="20" fill="#cc0000"/>
        <rect x="112" y="38" width="16" height="20" fill="#0000aa"/>
        <rect x="32" y="58" width="96" height="6" fill="#000"/>
        <rect x="32" y="60.5" width="96" height="1.5" fill="#fff"/>
        <rect x="32" y="64" width="96" height="18" fill="#000"/>
        <g fill="#fff">
          <rect x="36" y="64" width="3" height="18"/><rect x="43" y="64" width="3" height="18"/>
          <rect x="50" y="64" width="2.5" height="18"/><rect x="56" y="64" width="2" height="18"/>
          <rect x="61" y="64" width="1.6" height="18"/><rect x="65" y="64" width="1.3" height="18"/>
        </g>
        <rect x="70" y="64" width="58" height="18" fill="url(#pl-fine)"/>
        <rect x="32" y="82" width="16" height="8" fill="#000"/>
        <rect x="48" y="82" width="16" height="8" fill="#3a3a3a"/>
        <rect x="64" y="82" width="16" height="8" fill="#6a6a6a"/>
        <rect x="80" y="82" width="16" height="8" fill="#9a9a9a"/>
        <rect x="96" y="82" width="16" height="8" fill="#c4c4c4"/>
        <rect x="112" y="82" width="16" height="8" fill="#fff"/>
        <rect x="52" y="92" width="56" height="8" fill="#000"/>
        <rect x="32" y="100" width="96" height="10" fill="#ffff00"/>
        <rect x="74" y="100" width="12" height="10" fill="#cc0000"/>
      </g>
    </g>

    <!-- doodshoofd met gekruiste beenderen (in testbeeld-coördinaten) -->
    <g id="pl-skull" stroke-linecap="round">
      <path d="M52 88L108 32M108 88L52 32" stroke="#000" stroke-width="12"/>
      <path d="M52 88L108 32M108 88L52 32" stroke="#fff" stroke-width="7"/>
      <circle cx="80" cy="54" r="22" fill="#fff" stroke="#000" stroke-width="3.5"/>
      <rect x="68" y="68" width="24" height="14" rx="4" fill="#fff" stroke="#000" stroke-width="3.5"/>
      <circle cx="72" cy="54" r="5.5" fill="#000" stroke="none"/>
      <circle cx="88" cy="54" r="5.5" fill="#000" stroke="none"/>
      <path d="M80 60l-3.2 6h6.4z" fill="#000" stroke="none"/>
      <path d="M74 70v8M80 70v8M86 70v8" stroke="#000" stroke-width="1.8"/>
    </g>
  </defs>

  <!-- testbeeld-ring als maan -->
  <g fill="none" stroke="#5b8cff" stroke-opacity=".45" stroke-width="2">
    <circle cx="110" cy="72" r="62"/>
    <circle cx="110" cy="72" r="40" stroke-opacity=".3"/>
    <path d="M110 6V138M44 72H176" stroke-opacity=".25"/>
  </g>

  <!-- masten -->
  <g stroke="#2a190c" stroke-width="4" stroke-linecap="round">
    <path d="M110 22V100"/>
    <path d="M53 44V100"/>
    <path d="M167 40V100"/>
    <path d="M26 99L6 84" stroke-width="3"/>
  </g>

  <!-- zeilen met testbeeld -->
  <g clip-path="url(#pl-s-main)">
    <g transform="translate(78 38) scale(.4)"><use href="#pl-tp"/><g transform="translate(16 12) scale(.8)"><use href="#pl-skull"/></g></g>
  </g>
  <g clip-path="url(#pl-s-fore)">
    <g transform="translate(33 56) scale(.25)"><use href="#pl-tp"/></g>
  </g>
  <g clip-path="url(#pl-s-miz)">
    <g transform="translate(147 53) scale(.25)"><use href="#pl-tp"/></g>
  </g>
  <g fill="none" stroke="#7a6636" stroke-width="1.4">
    <path d="M76 38Q110 48 144 38V80Q110 90 76 80Z"/>
    <path d="M34 56Q53 62 72 56V86Q53 92 34 86Z"/>
    <path d="M148 52Q167 58 186 52V82Q167 88 148 82Z"/>
  </g>

  <!-- romp -->
  <path d="M20 96H198Q192 126 152 133H74Q34 128 20 96Z" fill="url(#pl-hull)" stroke="#24150a" stroke-width="2"/>
  <rect x="160" y="86" width="38" height="10" fill="#5a3a1c" stroke="#24150a" stroke-width="1.5"/>
  <path d="M30 106H190M38 116H182" stroke="#24150a" stroke-opacity=".45" stroke-width="1.5"/>
  <g fill="#1b1008">
    <rect x="52"  y="100" width="9" height="6" rx="1"/>
    <rect x="76"  y="100" width="9" height="6" rx="1"/>
    <rect x="100" y="100" width="9" height="6" rx="1"/>
    <rect x="124" y="100" width="9" height="6" rx="1"/>
  </g>
  <g fill="#ffd24d">
    <circle cx="170" cy="101" r="2.6"/>
    <circle cx="182" cy="101" r="2.6"/>
  </g>

  <!-- golven -->
  <path d="M4 128Q22 118 40 128T76 128T112 128T148 128T184 128T216 126" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M16 140Q34 131 52 140T88 140T124 140T160 140T196 140" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-opacity=".8"/>
</svg>
